<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💩 廁所龍虎榜（雲端版）</title>
<style>
  :root{
    --bg:#1c1410; --card:#2a1f18; --accent:#c98a4b; --accent2:#e8b26b;
    --text:#f4ead9; --muted:#9c8b78; --danger:#e06c5a; --ok:#7fbf7f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Microsoft JhengHei",sans-serif;
    background:radial-gradient(120% 90% at 50% 0%, #2b1d14 0%, var(--bg) 60%);
    color:var(--text); min-height:100vh; padding:16px 14px 44px;
  }
  .wrap{max-width:460px; margin:0 auto;}

  #nameScreen{text-align:center; padding-top:16vh;}
  #nameScreen h1{font-size:34px; margin:0 0 6px;}
  #nameScreen p{color:var(--muted); margin:0 0 22px;}
  #nameInput{
    width:100%; padding:16px; font-size:18px; text-align:center;
    background:var(--card); color:var(--text); border:2px solid var(--accent);
    border-radius:14px; outline:none;
  }
  #nameGo{
    margin-top:14px; width:100%; padding:16px; font-size:18px; font-weight:700;
    background:var(--accent); color:#241708; border:none; border-radius:14px; cursor:pointer;
  }

  #main{display:none;}
  .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .who{font-size:20px; font-weight:800;}
  .who small{display:block; color:var(--muted); font-weight:400; font-size:12px;}
  .date{color:var(--muted); font-size:12px; text-align:right;}

  #syncBar{display:flex; align-items:center; justify-content:space-between; background:#23190f; border:1px solid #3d2f1f; border-radius:12px; padding:8px 12px; margin-bottom:12px; font-size:12px; color:var(--muted);}
  #syncBar .dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:#666; margin-right:6px; vertical-align:middle;}
  #syncBar.ok .dot{background:var(--ok);}
  #syncBar.err .dot{background:var(--danger);}

  .bigcard{
    background:var(--card); border-radius:22px; padding:24px 20px 20px; text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.35); margin-bottom:14px;
  }
  .todayLabel{color:var(--muted); font-size:14px; letter-spacing:1px;}
  .count{font-size:100px; font-weight:900; line-height:1; margin:8px 0 4px;
    background:linear-gradient(180deg,#fff,var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .verdict{font-size:15px; color:var(--muted); min-height:22px;}

  .btn{
    display:block; width:100%; padding:22px; font-size:22px; font-weight:800;
    border:none; border-radius:18px; cursor:pointer; transition:transform .06s;
    background:linear-gradient(180deg,#e0a45c,#c47f3d); color:#2a1a08;
    box-shadow:0 8px 0 #8a5a28, 0 14px 24px rgba(0,0,0,.3);
  }
  .btn:active{transform:translateY(5px); box-shadow:0 3px 0 #8a5a28;}
  .subrow{display:flex; gap:10px; margin-top:12px;}
  .sub{
    flex:1; padding:14px; font-size:15px; font-weight:700; border:none; border-radius:12px;
    cursor:pointer; background:var(--card); color:var(--text); border:1px solid #4a3827;
  }
  .sub.danger{color:var(--danger);}

  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px;}
  .stat{background:var(--card); border-radius:16px; padding:14px 8px; text-align:center;}
  .stat .n{font-size:24px; font-weight:900;}
  .stat .l{font-size:12px; color:var(--muted); margin-top:3px;}

  .boardTitle{margin:22px 0 10px; font-size:16px; font-weight:800; color:var(--accent2);}
  #board{display:flex; flex-direction:column; gap:8px;}
  .row{
    display:flex; align-items:center; gap:10px; background:var(--card);
    border-radius:14px; padding:12px 14px; border:1px solid #3d2f1f;
  }
  .row.me{border-color:var(--accent); background:#332417;}
  .rank{font-size:20px; width:28px; text-align:center; font-weight:900; color:var(--muted);}
  .rank.r1{color:#f6c453;} .rank.r2{color:#c9d1d9;} .rank.r3{color:#cd9a6b;}
  .row .nm{flex:1; font-weight:700; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row .nm small{display:block; color:var(--muted); font-weight:400; font-size:11px;}
  .row .today{font-size:22px; font-weight:900; text-align:right;}
  .row .today small{display:block; color:var(--muted); font-weight:400; font-size:10px;}

  .share{
    margin-top:14px; width:100%; padding:15px; font-size:16px; font-weight:700;
    background:#3d5a3d; color:#d7f0d7; border:none; border-radius:14px; cursor:pointer;
  }
  .hint{margin-top:16px; color:var(--muted); font-size:12px; line-height:1.6; text-align:center;}
  #toast{
    position:fixed; left:50%; bottom:30px; transform:translateX(-50%);
    background:#000; color:#fff; padding:10px 18px; border-radius:10px; font-size:14px;
    opacity:0; transition:opacity .3s; pointer-events:none; z-index:99;
  }
  #toast.show{opacity:.95;}
</style>
</head>
<body>
<div class="wrap">

  <div id="nameScreen">
    <h1>💩</h1>
    <p>你叫咩名？（同朋友用返各自嘅名）</p>
    <input id="nameInput" maxlength="12" placeholder="例如：阿橋" autocomplete="off">
    <button id="nameGo">加入龍虎榜 ✅</button>
  </div>

  <div id="main">
    <div class="top">
      <div class="who"><span id="whoName"></span><small id="whoSub">載入中…</small></div>
      <div class="date" id="dateStr"></div>
    </div>

    <div id="syncBar"><span><span class="dot"></span><span id="syncText">同步中…</span></span><button id="refreshBtn" style="background:none;border:1px solid #4a3827;color:var(--text);border-radius:8px;padding:4px 10px;cursor:pointer;">🔄 更新</button></div>

    <div class="bigcard">
      <div class="todayLabel">我今日痾咗</div>
      <div class="count" id="todayCount">0</div>
      <div class="verdict" id="verdict">今日未開齋 🥲</div>
    </div>

    <button class="btn" id="poopBtn">💩 +1 痾咗一次</button>
    <div class="subrow">
      <button class="sub" id="undoBtn">↩️ 手殘減一</button>
      <button class="sub danger" id="resetBtn">🗑 今日清零</button>
    </div>

    <div class="stats">
      <div class="stat"><div class="n" id="weekCount">0</div><div class="l">近7日</div></div>
      <div class="stat"><div class="n" id="streak">0</div><div class="l">連續日數</div></div>
      <div class="stat"><div class="n" id="totalCount">0</div><div class="l">總計</div></div>
    </div>

    <div class="boardTitle">🏆 廁所龍虎榜</div>
    <div id="board"></div>

    <button class="share" id="shareBtn">📣 分享今日戰績</button>

    <div class="hint">朋友開同一條 link、入自己個名就一齊上榜。資料存喺雲端（大家 share）。</div>
  </div>

</div>

<div id="toast"></div>

<script>
(function(){
  var GIST_ID = "8e2ebb63edd1d09eea14b1bac0d3330b";
  var RAW_URL = "https://gist.githubusercontent.com/Ansonh436/" + GIST_ID + "/raw/leaderboard.json";
  var API_URL = "https://api.github.com/gists/" + GIST_ID;
  var TOKEN = atob("Z2hwXzdsWEZMRWxaR1ozNlFLMVkydnlZeGcxRVZKZThXWDNZYVQ3Mg==");

  var myName = localStorage.getItem('poop_name') || '';
  var state = { users: {} };
  var busy = false;

  function todayKey(d){
    d = d || new Date();
    var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+day;
  }
  function get(logs,k){ return (logs && logs[k]) || 0; }
  function calcStreak(logs){
    var s=0, d=new Date();
    for(var i=0;i<3650;i++){
      if(get(logs, todayKey(d))>0){ s++; d.setDate(d.getDate()-1); }
      else break;
    }
    return s;
  }
  function last7(logs){
    var sum=0, d=new Date();
    for(var i=0;i<7;i++){ sum += get(logs, todayKey(d)); d.setDate(d.getDate()-1); }
    return sum;
  }
  function total(logs){
    var t=0; for(var k in (logs||{})) t += logs[k]; return t;
  }
  function verdict(n){
    if(n===0) return '今日未開齋 🥲';
    if(n===1) return '正常排泄 ✅';
    if(n===2) return '身體暢通 👍';
    if(n===3) return '腸胃好活躍 🚀';
    if(n>=4 && n<=6) return '瀨嘢級別，注意保重 🤯';
    return '史詩級輸出 🏆';
  }

  function setSync(status, text){
    var bar = document.getElementById('syncBar');
    bar.className = status; // '', 'ok', 'err'
    document.getElementById('syncText').textContent = text;
  }

  async function readState(){
    var r = await fetch(RAW_URL + '?ts=' + Date.now(), { cache: 'no-store' });
    var txt = await r.text();
    var data = JSON.parse(txt);
    if(!data || typeof data.users !== 'object') data = { users: {} };
    return data;
  }

  async function writeState(s){
    var body = JSON.stringify({ files: { "leaderboard.json": { content: JSON.stringify(s) } } });
    var r = await fetch(API_URL, {
      method: 'PATCH',
      headers: { 'Authorization': 'token ' + TOKEN, 'Content-Type': 'application/json' },
      body: body
    });
    if(!r.ok) throw new Error('HTTP ' + r.status);
  }

  async function refresh(){
    try {
      state = await readState();
      render();
      setSync('ok', '已同步 ' + new Date().toLocaleTimeString('zh-HK',{hour12:false}));
    } catch(e) {
      setSync('err', '同步失敗');
    }
  }

  async function mutate(fn){
    if(busy) return;
    busy = true;
    setSync('', '同步中…');
    try {
      var fresh = await readState();
      fn(fresh);
      await writeState(fresh);
      state = fresh;
      render();
      setSync('ok', '已同步');
    } catch(e) {
      setSync('err', '同步失敗，再試下');
      toast('同步失敗，稍等再撳');
    }
    busy = false;
  }

  function ensureMe(s){
    if(!s.users[myName]){
      s.users[myName] = { joined: todayKey(), logs: {} };
    }
    return s.users[myName];
  }

  // ---- name ----
  function startWithName(){
    var v = document.getElementById('nameInput').value.trim();
    if(!v){ document.getElementById('nameInput').focus(); return; }
    myName = v;
    localStorage.setItem('poop_name', myName);
    showMain();
    refresh();
  }
  function showMain(){
    document.getElementById('nameScreen').style.display='none';
    document.getElementById('main').style.display='block';
    document.getElementById('whoName').textContent = myName;
  }

  // ---- render ----
  function render(){
    var t = todayKey();
    var me = state.users[myName];
    var myLogs = me ? me.logs : {};
    var n = get(myLogs, t);
    document.getElementById('todayCount').textContent = n;
    document.getElementById('verdict').textContent = verdict(n);
    document.getElementById('weekCount').textContent = last7(myLogs);
    document.getElementById('streak').textContent = calcStreak(myLogs);
    document.getElementById('totalCount').textContent = total(myLogs);
    document.getElementById('whoSub').textContent = (me && me.joined) ? ('自 ' + me.joined) : '新成員';
    var d=new Date();
    var wd=['日','一','二','三','四','五','六'][d.getDay()];
    document.getElementById('dateStr').textContent = (d.getMonth()+1)+'月'+d.getDate()+'日 星期'+wd;

    // leaderboard
    var rows = Object.keys(state.users).map(function(name){
      var u = state.users[name];
      return { name:name, today:get(u.logs,t), total:total(u.logs), streak:calcStreak(u.logs) };
    }).sort(function(a,b){ return (b.today-a.today) || (b.total-a.total); });

    var board = document.getElementById('board');
    board.innerHTML = '';
    if(rows.length===0){
      board.innerHTML = '<div class="row"><div class="nm">仲未有人上榜，做第一個 💩</div></div>';
      return;
    }
    rows.forEach(function(r, i){
      var div = document.createElement('div');
      div.className = 'row' + (r.name===myName ? ' me' : '');
      var rk = i+1;
      var rc = rk===1?'r1':(rk===2?'r2':(rk===3?'r3':''));
      div.innerHTML =
        '<div class="rank '+rc+'">'+(rk<=3?['🥇','🥈','🥉'][rk-1]:rk)+'</div>' +
        '<div class="nm">'+escapeHtml(r.name)+'<small>連續 '+r.streak+' 日 · 累計 '+r.total+'</small></div>' +
        '<div class="today">'+r.today+'<small>今日</small></div>';
      board.appendChild(div);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }

  function toast(msg){
    var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('show'); },1600);
  }

  // ---- events ----
  document.getElementById('nameGo').addEventListener('click', startWithName);
  document.getElementById('nameInput').addEventListener('keydown', function(e){ if(e.key==='Enter') startWithName(); });
  document.getElementById('poopBtn').addEventListener('click', function(){
    mutate(function(s){ var me=ensureMe(s); var k=todayKey(); me.logs[k]=(me.logs[k]||0)+1; });
  });
  document.getElementById('undoBtn').addEventListener('click', function(){
    mutate(function(s){ var me=ensureMe(s); var k=todayKey(); if((me.logs[k]||0)>0) me.logs[k]--; });
  });
  document.getElementById('resetBtn').addEventListener('click', function(){
    if(!confirm('確定將今日歸零？')) return;
    mutate(function(s){ var me=ensureMe(s); me.logs[todayKey()]=0; });
  });
  document.getElementById('refreshBtn').addEventListener('click', refresh);
  document.getElementById('shareBtn').addEventListener('click', function(){
    var t=todayKey(); var me=state.users[myName]; var n= me?get(me.logs,t):0;
    var txt='💩 廁所日報\n我叫 '+myName+'，今日痾咗 '+n+' 次！\n連續 '+calcStreak(me?me.logs:{})+' 日有貨 🚽';
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast('已複製，貼去 group 📋'); }, function(){ fallbackCopy(txt); });
    } else fallbackCopy(txt);
  });
  function fallbackCopy(txt){
    var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); toast('已複製 📋'); }catch(e){ toast(txt); }
    document.body.removeChild(ta);
  }

  // ---- start ----
  if(myName){ showMain(); refresh(); }
  else { document.getElementById('nameInput').focus(); }

  setInterval(refresh, 8000);
})();
</script>
</body>
</html>
